<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tide Pool - Watch Thoughts Find Each Other</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="ocean-container">
        <canvas id="tidepool"></canvas>

        <div class="controls">
            <div class="input-group">
                <input
                    type="text"
                    id="thoughtInput"
                    placeholder="Drop a thought into the pool... (use #hashtags)"
                    maxlength="120"
                />
                <button id="dropButton">Drop</button>
            </div>

            <div class="info">
                <span id="bubbleCount">0 thoughts floating</span>
                <span id="mergeCount">0 connections formed</span>
            </div>
        </div>

        <div class="mystery">
            <p>It's not AI. It's not algorithms. It's something simpler.</p>
        </div>
    </div>

    <script src="tidepool.js"></script>
</body>
</html>
